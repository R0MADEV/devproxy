log:
  level: INFO

entryPoints:
  web:
    address: ":8090"
  traefik:
    address: ":8091"

api:
  insecure: true
  dashboard: true

providers:
  file:
    directory: /etc/traefik/projects
    watch: true

# ============================================================
# Add your project routes below.
# Each project should have its own subnet (e.g. 10.200.x.0/24)
# to avoid port conflicts between projects.
#
# Example — my-project (subnet 10.200.1.0/24):
#
# http:
#   routers:
#     my-project:
#       rule: "Host(`my-project.localhost`)"
#       entryPoints:
#         - web
#       service: my-project
#
#   services:
#     my-project:
#       loadBalancer:
#         servers:
#           - url: "http://10.200.1.10:80"
# ============================================================
